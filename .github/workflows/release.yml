name: Build and Release

# 触发方式：
#   1) 推送形如 v1.0.0 的 tag  → 自动编译、打包、发布 Release
#   2) 在 Actions 页面手动触发（workflow_dispatch）→ 只产出构建物，不发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $v = 'v0.0.0-dev'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v"

      - name: 使用统一构建脚本编译
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: .\build.ps1 -Version $env:BUILD_VERSION

      - name: 上传构建物
        uses: actions/upload-artifact@v4
        with:
          name: OneKeyTool-${{ steps.ver.outputs.version }}
          path: dist/*-win-x64.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 不设 name 时会直接用 tag 名（v1.1.0）当标题，这里加上项目名
          name: OneKeyTool ${{ steps.ver.outputs.version }}
          files: dist/*-win-x64.zip
          generate_release_notes: true
          draft: false
          body: |
            ## 下载

            下载下方的 `OneKeyTool-${{ steps.ver.outputs.version }}-win-x64.zip`，
            解压到**任意文件夹**（建议放文档或桌面，不要放 Program Files），
            双击里面的 `OneKeyTool.exe` 即可使用，**无需安装**。

            首次启动会在 exe 同目录自动生成 `config.ini`，之后改配置就改它。

            ## 环境要求

            - Windows 10 / 11（64 位）
            - 系统自带 .NET Framework 4.0 以上（Win10/11 已内置，无需额外安装）

            ## 首次使用

            程序默认处于**观察模式**：只识别按键、不拦截。
            按几次键盘上那个自定义键，确认界面上"已触发"计数正常增加后，
            在设置窗口里**取消勾选"观察模式"**并点"保存并应用"，即可正式生效。

            ## 关于升级

            本程序**不联网、不自动更新**。升级方式：下载新版 zip，解压后
            覆盖旧的 `OneKeyTool.exe` 即可（`config.ini` 是你的配置，不会被覆盖）。
            托盘菜单的「关于」里也能直接打开这个下载页面。

            详见仓库的 `README.md`。
