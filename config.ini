# ═══════════════════════════════════════════════════════════
#  OneKeyTool 配置文件
#  改完后点界面上的"保存并应用"，或在托盘菜单选"重新加载配置"
# ═══════════════════════════════════════════════════════════

# ─────────── 总开关 ───────────
# true = 启用；false = 完全不干预键盘
Enabled=true

# ─────────── 按下自定义键时做什么 ───────────
# 可选值：
#   url      打开网址
#   program  运行程序 / 打开文件 / 打开文件夹
#   hotkey   发送一组快捷键
#   none     什么都不做（只屏蔽原来的联想网址）
ActionType=url

# 动作参数，含义随 ActionType 而定：
#   url     例：https://www.bing.com
#   program 例：C:\Windows\System32\notepad.exe
#           例：D:\我的文档            （打开文件夹）
#   hotkey  例：Ctrl+Alt+S
#           例：Win+Shift+S          （Windows 截图）
#           例：Ctrl+Shift+Esc       （任务管理器）
ActionValue=https://www.bing.com

# ─────────── 拦截范围 ───────────
# true = 同时拦截 Win 键（推荐）
#   自定义键的宏会先模拟按下 Win 键，若不一并拦截，
#   屏幕上会先闪出一个"运行"对话框。保持 true 可避免。
SuppressWindowsKey=true

# ─────────── 观察模式（首次使用请保持 true）───────────
# true  = 只识别、计数、提示，不拦截任何按键。原网址仍会照常打开。
# false = 真正拦截，原网址不再打开，改为执行上面的动作。
#
# 建议：先保持 true 按几次自定义键，确认界面上"已触发 N 次"
#       跟着增加、且正常打字/按 Win 键不会误报，再改成 false。
DryRun=true

# ─────────── 开机自启 ───────────
# 不在此文件配置。请在设置窗口勾选"开机自动启动"，或在托盘菜单里切换。
# 它写入的是当前用户注册表 HKCU\Software\Microsoft\Windows\CurrentVersion\Run，
# 以注册表实际状态为准，因此不保存在本文件里。

# ─────────── 高级时序参数（毫秒，一般不用改）───────────
# 按下 Win 后等待 Win↑ 的时长（实测固件这一跳约 12ms）
# 注意：单独按 Win 时，实际感到的延迟 ≈ 本值 + 15ms（收尾定时器周期），当前约 65ms
WinWaitMs=50
# Win↑ 后等待 R 的时长（宏里这一跳约 4ms，取小值以免拖慢正常按 Win）
WinUpWaitMs=50
# 检测到 Win+R 后，等待首个宏字符的时长
RWaitMs=250
# 整个宏序列的最长允许时长，超时即放弃拦截
MacroTimeoutMs=4000

# 调试与特征配置
DebugKeys=false
Signature=ONECLICK
# 测试用：是否处理本程序自己注入的按键。正常运行必须为 false，否则会自我触发
AcceptInjected=false
