name: Build and Release

# 触发方式：
#   1) 推送形如 v1.0.0 的 tag  → 自动编译、打包、发布 Release
#   2) 在 Actions 页面手动触发（workflow_dispatch）→ 只产出构建物，不发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $v = 'v0.0.0-dev'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v"

      - name: 使用统一构建脚本编译并打包
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: .\build.ps1 -Version $env:BUILD_VERSION

      - name: 上传构建物
        uses: actions/upload-artifact@v4
        with:
          name: OneKeyTool-${{ steps.ver.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 不设 name 时会直接用 tag 名（v1.1.0）当标题，这里加上项目名
          name: OneKeyTool ${{ steps.ver.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          body: |
            ## 下载

            下载下方的 `OneKeyTool-${{ steps.ver.outputs.version }}-win-x64.zip`，
            **解压到任意文件夹**（建议放在文档或桌面，不要放 Program Files），
            双击 `OneKeyTool.exe` 即可使用，**无需安装**。

            ## 环境要求

            - Windows 10 / 11（64 位）
            - 系统自带 .NET Framework 4.0 以上（Win10/11 已内置，无需额外安装）

            ## 首次使用

            程序默认处于**观察模式**：只识别按键、不拦截。
            按几次键盘上那个自定义键，确认界面上"已触发"计数正常增加后，
            在设置窗口里**取消勾选"观察模式"**并点"保存并应用"，即可正式生效。

            ## 本次更新

            - 新增**开机自动启动**：设置窗口勾选即可，写入当前用户注册表，
              无需管理员权限；取消勾选立即移除。程序被移动后自启路径会自动更新。
            - 修复设置窗口中"同时拦截 Win 键""观察模式"两个选项被界面裁掉、
              无法点击的问题。
            - 删除配置文件后重新生成时，默认值现与随包配置一致（均为观察模式）。

            详见包内的 `README.md`。
