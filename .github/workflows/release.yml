name: Build and Release

# 触发方式：
#   1) 推送形如 v1.0.0 的 tag  → 自动编译、打包、发布 Release
#   2) 推送到 main / 提 PR     → 只编译并跑状态机测试，不发布（保证主干随时是绿的）
#   3) 在 Actions 页面手动触发（workflow_dispatch）→ 只产出构建物，不发布

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $v = 'v0.0.0-dev'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $v"

      - name: 校验「不含网络代码」这条承诺
        shell: pwsh
        run: |
          # README 把"完全不联网"写成了对用户的承诺，这里把它变成机器保证：
          # src/ 里一旦出现网络相关类型，构建直接失败。
          $hits = Select-String -Path src\*.cs -CaseSensitive `
                    -Pattern 'System\.Net|WebClient|HttpWebRequest|ServicePointManager'
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.ToString() }
            throw "src/ 中出现了网络相关代码。本程序承诺不联网，请勿引入。"
          }
          Write-Host "OK：src/ 中没有网络代码"

      - name: 校验 BuildInfo 字段与 build.ps1 模板同步
        shell: pwsh
        run: |
          # src\BuildInfo.cs 是手工编译的兜底值，正式构建用 build.ps1 里的同名模板覆盖。
          # 两边字段一旦不同步，正式构建会以 CS0117 失败（且只有发版时才暴露）。
          $pattern = 'public const string (\w+)'
          $fromSrc = [regex]::Matches((Get-Content src\BuildInfo.cs -Raw -Encoding UTF8), $pattern) |
                     ForEach-Object { $_.Groups[1].Value } | Sort-Object
          $fromScript = [regex]::Matches((Get-Content build.ps1 -Raw -Encoding UTF8), $pattern) |
                        ForEach-Object { $_.Groups[1].Value } | Sort-Object
          if (($fromSrc -join ',') -ne ($fromScript -join ',')) {
            throw "BuildInfo 字段不一致：src=[$($fromSrc -join ', ')] build.ps1=[$($fromScript -join ', ')]"
          }
          Write-Host "OK：BuildInfo 字段一致（$($fromSrc -join ', ')）"

      - name: 使用统一构建脚本编译
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: .\build.ps1 -Version $env:BUILD_VERSION

      - name: 上传构建物
        # 只有 tag 与手动触发才留构建物；main/PR 的流水线只为跑测试
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: OneKeyTool-${{ steps.ver.outputs.version }}
          path: dist/*-win-x64.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 不设 name 时会直接用 tag 名（v1.1.0）当标题，这里加上项目名
          name: OneKeyTool ${{ steps.ver.outputs.version }}
          files: dist/*-win-x64.zip
          generate_release_notes: true
          draft: false
          body: |
            ## 下载

            下载下方的 `OneKeyTool-${{ steps.ver.outputs.version }}-win-x64.zip`，
            解压到**任意文件夹**（建议放文档或桌面，不要放 Program Files），
            双击里面的 `OneKeyTool.exe` 即可使用，**无需安装**。

            首次启动会在 exe 同目录自动生成 `config.ini`，之后改配置就改它。

            ## 环境要求

            - Windows 10 / 11（64 位）
            - 系统自带 .NET Framework 4.0 以上（Win10/11 已内置，无需额外安装）

            ## 首次使用

            程序默认处于**观察模式**：只识别按键、不拦截。
            按几次键盘上那个自定义键，确认界面上"已触发"计数正常增加后，
            在设置窗口里**取消勾选"观察模式"**并点"保存并应用"，即可正式生效。

            ## 关于升级

            本程序**不联网、不自动更新**。升级方式：下载新版 zip，解压后
            覆盖旧的 `OneKeyTool.exe` 即可（`config.ini` 是你的配置，不会被覆盖）。
            托盘菜单的「关于」里也能直接打开这个下载页面。

            详见仓库的 `README.md`。
